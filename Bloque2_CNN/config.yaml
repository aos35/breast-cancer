# Configuration File for Bloque2_CNN - Multi-Task Breast Cancer Detection Pipeline
# May 2026

---
project:
  name: "Bloque2_CNN"
  description: "Classification + Detection + Segmentation Pipeline for Breast Cancer"
  version: "1.0"
  dataset: "DMID (Digital Mammography Image Dataset)"

---
## DATA CONFIGURATION
data:
  # Paths (relative to Bloque2_CNN/)
  tiff_dir: "../../DMID_PNG/"                # Imagen mamografías
  masks_dir: "../../DMID_PNG/masks/"         # Ground truth segmentación (269 images)
  pla_dir: "../../DMID_PNG/pla/"             # Pixel-level annotation (269 images)
  metadata_path: "../../Metadata.xlsx"       # Etiquetas clasificación
  
  # Dataset stats
  total_images: 511                          # Total TIFF images
  annotated_images: 269                      # Con Mask + PLA
  metadata_records: 647                      # Instancias en metadata
  unique_images: 510                         # Imágenes únicas
  
  # Class distribution
  class_distribution:
    benign: 0.391                            # 39.1%
    malignant: 0.244                         # 24.4%
    no_defined: 0.056                        # 5.6%
    negative: 0.309                          # 30.9% (no tumor)
  
  # Image specs
  image_shape: [512, 512]                    # Resolución TIFF
  image_channels: 1                          # Escala gris (mamografía)
  
  # Data split (estratificado por clase)
  train_split: 0.60                          # 60% training
  val_split: 0.20                            # 20% validation
  test_split: 0.20                           # 20% testing
  
  # Data augmentation
  augmentation:
    enabled: true
    intensity_augment: true                  # Brightness/contrast
    spatial_augment: true                    # Rotación, zoom, flip
    elastic_augment: false                   # Solo para segmentación
  
  augmentation_params:
    rotation_range: [-15, 15]                # Grados
    zoom_range: [0.8, 1.2]                   # Factor
    horizontal_flip: true
    vertical_flip: false                     # NO para mamografía
    intensity_scale: [-0.1, 0.1]             # ±10%
    noise_std: 0.02                          # Gaussian noise
    elastic_alpha: 30                        # Para elastic deformations
    elastic_sigma: 5

---
## TASK 1: CLASSIFICATION (Benign/Malignant/Negative)
classification:
  # Model architecture
  model: "densenet121"                       # Options: densenet121, resnet50, efficientnet
  num_classes: 3                             # Benign(0), Malignant(1), Negative(2)
  pretrained: true                           # Use ImageNet pre-training
  input_size: [1, 512, 512]                  # (channels, height, width)
  
  # Training parameters
  batch_size: 32
  epochs: 200
  learning_rate: 0.0001
  optimizer: "adam"                          # adam, sgd
  scheduler: "exponential"                   # exponential, step, cosine
  scheduler_params:
    gamma: 0.95                              # multiplicative factor
    step_size: 10                            # decay every N epochs
  
  # Loss function
  loss: "cross_entropy_weighted"             # weighted for class imbalance
  class_weights: [0.51, 0.81, 0.65]        # Inverse class frequency
  
  # Regularization
  dropout: 0.3
  weight_decay: 0.0001                       # L2 regularization
  early_stopping:
    enabled: true
    patience: 20                             # epochs without improvement
    metric: "val_auc_roc"                   # Monitor AUC-ROC
    mode: "max"
  
  # Metrics to monitor
  metrics: ["accuracy", "precision", "recall", "f1", "auc_roc"]
  
  # Checkpoint saving
  save_best: true
  save_dir: "./models/classification/"
  checkpoint_interval: 10                    # Save every N epochs

---
## TASK 2: DETECTION (Localize anomalies with bounding boxes)
detection:
  # Model architecture
  model: "mask_rcnn"                         # Mask R-CNN ResNet50-FPN
  backbone: "resnet50"
  num_classes: 2                             # Anomaly (1) + Background (0)
  pretrained: true                           # COCO pre-training
  input_size: [1, 512, 512]
  
  # Training parameters
  batch_size: 8                              # Smaller for memory efficiency
  epochs: 150
  learning_rate: 0.0001
  optimizer: "sgd"
  scheduler: "step"
  scheduler_params:
    step_size: 50
    gamma: 0.1
  
  # Loss function (integrated in Mask R-CNN)
  loss: "multi_task"                         # bbox regression + classification
  
  # Regularization
  weight_decay: 0.0005
  early_stopping:
    enabled: true
    patience: 20
    metric: "val_map"
    mode: "max"
  
  # Metrics
  metrics: ["precision", "recall", "map", "iou"]
  
  # Checkpoint saving
  save_best: true
  save_dir: "./models/detection/"
  checkpoint_interval: 10
  
  # Inference parameters
  score_threshold: 0.5                       # Min confidence for detections
  nms_threshold: 0.3                         # Non-Maximum Suppression

---
## TASK 3: SEGMENTATION (Delineate lesion boundaries)
segmentation:
  # Models to train (can train both for comparison)
  models: ["unet", "deeplabv3"]              # Try both architectures
  
  ### U-Net Configuration
  unet:
    model_name: "unet"
    input_size: [1, 512, 512]
    output_size: [1, 512, 512]
    encoder_channels: [64, 128, 256, 512]
    decoder_channels: [512, 256, 128, 64]
    pretrained: false                        # No pre-training for U-Net
  
  ### DeepLabV3+ Configuration
  deeplabv3:
    model_name: "deeplabv3+"
    backbone: "resnet50"
    output_stride: 16                        # Feature map resolution
    pretrained_backbone: true                # ImageNet for backbone
    input_size: [1, 512, 512]
    output_size: [1, 512, 512]
  
  # Training parameters (common)
  batch_size: 16
  epochs: 200
  learning_rate: 0.001
  optimizer: "adam"
  scheduler: "cosine"                        # cosine annealing
  scheduler_params:
    t_max: 200                               # Full training duration
  
  # Loss function
  loss: "combined"                           # 0.5*Dice + 0.5*BCE
  loss_params:
    lambda_dice: 0.5
    lambda_bce: 0.5
  
  # Regularization
  dropout: 0.2
  weight_decay: 0.0001
  early_stopping:
    enabled: true
    patience: 30                             # Longer patience for seg
    metric: "val_dice"
    mode: "max"
  
  # Metrics to monitor
  metrics: ["dice", "iou", "accuracy", "sensitivity", "specificity"]
  
  # Checkpoint saving
  save_best: true
  save_dir: "./models/segmentation/"
  checkpoint_interval: 10
  
  # Post-processing
  post_processing:
    threshold: 0.5                           # Probability threshold for binary
    morphological_closing: true
    closing_kernel_size: 5
    remove_small_objects: true
    min_object_size: 50                      # pixels

---
## HARDWARE & TRAINING
training:
  device: "cuda"                             # cuda or cpu
  num_workers: 4                             # DataLoader workers
  pin_memory: true
  mixed_precision: false                     # AMP (Automatic Mixed Precision)
  
  # Reproducibility
  seed: 42
  deterministic: true                        # Deterministic algorithms
  
  # Logging
  log_dir: "./logs/"
  tensorboard: true
  save_interval: 100                         # Log every N batches

---
## EVALUATION
evaluation:
  # Metrics thresholds
  classification:
    target_auc_roc: 0.95                     # Target performance
    target_accuracy: 0.90
  
  detection:
    target_map: 0.90                         # @ IoU=0.5
    target_iou: 0.85
  
  segmentation:
    target_dice: 0.85
    target_iou: 0.75
  
  # Cross-validation
  kfold:
    enabled: true
    n_splits: 5
    stratified: true                         # Stratified by class

---
## INFERENCE
inference:
  batch_size: 32
  save_predictions: true
  output_format: "json"                      # json or pickle
  visualization:
    save_visualizations: true
    format: "png"
    dpi: 150

---
## PATHS (relative to Bloque2_CNN/)
paths:
  data_root: "../"
  output_root: "./"
  models_dir: "./models/"
  logs_dir: "./logs/"
  results_dir: "./results/"
  notebooks_dir: "./notebooks/"

---
## NOTES
notes: |
  - Class imbalance handled by weighted loss (Classification)
  - Detection uses metadata.xlsx coordinates to validate
  - Segmentation trained only on 269 annotated images
  - Pipeline is sequential: Classification → Detection → Segmentation
  - All models use early stopping to prevent overfitting
  - Learning rates calibrated for medical imaging (lower than typical)
